<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auramog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      font-family: sans-serif;
    }

    #container {
      position: relative;
      width: 100%;
      height: calc(100vh - 80px); /* leave room for banner */
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #unmute {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: rgba(0,0,0,0.25);
      font-size: 18px;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: opacity 0.4s ease;
      z-index: 2;
    }

    #unmute.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Bottom banner */
    #banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-decoration: none;
      z-index: 3;
    }

    #banner img {
      height: 56px;
      width: auto;
      border-radius: 6px;
    }

    #banner span {
      color: white;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      #container {
        height: calc(100vh - 72px);
      }
      #banner {
        height: 72px;
      }
      #banner img {
        height: 48px;
      }
      #banner span {
        font-size: 12px;
        letter-spacing: 0.15em;
      }
    }
  </style>
</head>
<body>

  <div id="container">
    <video
      id="video"
      autoplay
      muted
      playsinline
      loop
      preload="auto"
    >
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div id="unmute">TAP FOR SOUND</div>
  </div>

  <a
    id="banner"
    href="https://mogfits.etsy.com"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img src="moghat.avif" alt="Mog Hat">
    <span>Click here to get a mog hat</span>
  </a>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('unmute');

    overlay.addEventListener('click', () => {
      video.muted = false;
      video.volume = 1;
      video.play();
      overlay.classList.add('hidden');
    });
  </script>

</body>
</html>
