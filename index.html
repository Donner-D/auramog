      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
    }

    #unmute {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: rgba(0,0,0,0.25);
      font-size: 18px;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: opacity 0.4s ease;
      z-index: 2;
    }

    #unmute.hidden {
      opacity: 0;
      pointer-events: none;
    }
