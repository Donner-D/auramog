<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auramog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #unmute {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: rgba(0,0,0,0.25);
      font-size: 18px;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: opacity 0.4s ease;
    }

    #unmute.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <video id="video" autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div id="unmute">TAP FOR SOUND</div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('unmute');

    overlay.addEventListener('click', () => {
      video.muted = false;
      video.volume = 1;
      video.play();
      overlay.classList.add('hidden');
    });
  </script>

</body>
</html>
